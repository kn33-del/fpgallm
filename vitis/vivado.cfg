# Hand-written v++ link settings (u55c.cfg is generated by gen_kernel.py; keep edits here).
[vivado]
# Big inferred RAMs (mm_accum rows = 2 Mb, act_buf = 4 Mb) exceed Vivado's 1 Mb per-variable
# elaboration limit; without this the kernel synthesis inside v++ fails at elaboration.
param=synth.elaboration.rodinMoreOptions=rt::set_parameter var_size_limit 8388608
